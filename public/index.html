<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="description" content="雾钟城：第七声 — 单人文字冒险 RPG" />
  <title>雾钟城：第七声</title>
  <link rel="stylesheet" href="css/app.css?v=11-phase1" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='30' fill='%23141010'/%3E%3Ccircle cx='32' cy='32' r='28' fill='none' stroke='%23b8956a' stroke-width='2'/%3E%3Cpath d='M32 12v8M22 28c0-8 4-12 10-12s10 4 10 12l2 14c1 5-2 8-6 10h-12c-4-2-7-5-6-10z' fill='%23b8956a'/%3E%3Ccircle cx='32' cy='36' r='3' fill='%23c45c3a'/%3E%3C/svg%3E" />
</head>
<body class="theme-belfry gate-locked">
  <div id="fog" aria-hidden="true"></div>
  <div id="app">
    <!-- Title -->
    <section id="screen-title" class="screen active">
      <div class="title-card">
        <p class="eyebrow">单人文字冒险</p>
        <h1>雾钟城：第七声</h1>
        <p class="tagline">钟骨苏醒。回声病蔓延。你还有不到一夜，决定失去什么。</p>
        <div class="title-actions">
          <button type="button" class="btn primary" id="btn-new">开始旅程</button>
          <button type="button" class="btn" id="btn-continue" hidden>继续存档</button>
          <button type="button" class="btn ghost" id="btn-load">读取存档</button>
          <button type="button" class="btn ghost" id="btn-endings">已见结局</button>
        </div>
        <p class="hint">本地存档 · 封面门禁 · 三位主角 · 十余种结局</p>
      </div>
    </section>

    <!-- Character select -->
    <section id="screen-chars" class="screen">
      <div class="panel">
        <header class="panel-head">
          <h2>选择主角</h2>
          <p>未被选择的两人会作为同行者在故事中登场。</p>
        </header>
        <div id="char-grid" class="char-grid"></div>
        <button type="button" class="btn ghost" id="btn-chars-back">返回</button>
      </div>
    </section>

    <!-- Game -->
    <section id="screen-game" class="screen">
      <header class="hud" id="hud">
        <div class="hud-row hud-row-top">
          <div class="hud-place">
            <span id="hud-name" class="hud-name"></span>
            <span id="hud-loc" class="hud-loc"></span>
            <span id="hud-time" class="hud-time" title="时间"></span>
          </div>
          <div class="hud-actions">
            <button type="button" class="icon-btn" id="btn-journal" title="日志">日志</button>
            <button type="button" class="icon-btn" id="btn-bag" title="行囊">行囊</button>
            <button type="button" class="icon-btn" id="btn-people" title="人物">人物</button>
            <button type="button" class="icon-btn" id="btn-help" title="属性说明">?</button>
            <button type="button" class="icon-btn" id="btn-save" title="存档">存档</button>
            <button type="button" class="icon-btn" id="btn-menu" title="菜单">菜单</button>
          </div>
        </div>
        <div class="hud-row hud-vitals" id="hud-vitals" aria-label="状态">
          <button type="button" class="vital" id="hud-hp" title="体力" data-stat="hp"></button>
          <button type="button" class="vital" id="hud-vouchers" title="商会券" data-stat="vouchers"></button>
          <button type="button" class="vital" id="hud-resonance" title="共鸣" data-stat="resonance"></button>
          <button type="button" class="vital" id="hud-fall" title="沉沦" data-stat="fall"></button>
          <button type="button" class="vital" id="hud-power" title="战力" data-stat="power"></button>
        </div>
      </header>
      <main class="stage">
        <div id="result" class="result" aria-live="polite" hidden></div>
        <h2 id="node-title" class="node-title"></h2><small id="node-id" class="node-id"></small>
        <article id="node-text" class="node-text"></article>
        <div id="hub-status" class="hub-status" hidden></div>
        <div id="choices" class="choices"></div>
      </main>
    </section>

    <!-- Overlays -->
    <div id="overlay" class="overlay" hidden>
      <div class="modal" role="dialog" aria-modal="true">
        <header class="modal-head">
          <h3 id="modal-title"></h3>
          <button type="button" class="icon-btn" id="modal-close" aria-label="关闭">×</button>
        </header>
        <div id="modal-body" class="modal-body"></div>
      </div>
    </div>

    <div id="toast" class="toast" hidden></div>
  </div>
  <script src="js/checks.js?v=11-phase1"></script>
  <script src="js/save.js?v=11-phase1"></script>
  <script src="js/engine.js?v=11-phase1"></script>
  <script src="js/ui.js?v=11-phase1"></script>
  <script src="js/bgm.js?v=11-phase1"></script>
  <script src="js/gate.js?v=11-phase1"></script>
  <script src="js/main.js?v=11-phase1"></script>
</body>
</html>
